{% extends "base.html" %}
{% block title %}Giriş - Python Pro Sınav{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h1>İsmini Gir</h1>
    <p>Sınav sonuçlarını takip edebilmek için bir isim yaz.</p>
    <form method="POST">
        <label for="username">İsim / Kullanıcı adı</label>
        <input type="text" id="username" name="username" required minlength="2" maxlength="40" placeholder="Örn: Ali">
        <button type="submit" class="btn">Devam Et</button>
    </form>
</div>
{% endblock %}
